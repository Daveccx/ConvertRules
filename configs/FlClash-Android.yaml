# FlClash · Android
# 端口、TUN、DNS、Sniffer、进程模式由 FlClash 界面管理。

mixed-port: 7890
unified-delay: true
geo-auto-update: false
geo-update-interval: 24
tcp-concurrent: true
allow-lan: true
mode: rule
log-level: info
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true
NodeParam:
  type: http
  interval: 1800
  health-check: &id001
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 30
    timeout: 3000
    lazy: true
proxy-providers:
  Kitty:
    type: http
    interval: 1800
    health-check: *id001
    url: ''
    path: ./proxy_providers/provider-5.yaml
    override:
      additional-prefix: '[Kitty] '
  良心云:
    type: http
    interval: 1800
    health-check: *id001
    url: ''
    path: ./proxy_providers/provider-1.yaml
    override:
      additional-prefix: '[良心云] '
  干杯机场:
    type: http
    interval: 1800
    health-check: *id001
    url: ''
    path: ./proxy_providers/provider-2.yaml
    override:
      additional-prefix: '[干杯机场] '
  亏本机场:
    type: http
    interval: 1800
    health-check: *id001
    url: ''
    path: ./proxy_providers/provider-3.yaml
    override:
      additional-prefix: '[亏本机场] '
  赔钱机场:
    type: http
    interval: 1800
    health-check: *id001
    url: ''
    path: ./proxy_providers/provider-4.yaml
    override:
      additional-prefix: '[赔钱机场] '
  顶级机场:
    type: http
    interval: 1800
    health-check: *id001
    url: ''
    path: ./proxy_providers/provider-6.yaml
    override:
      additional-prefix: '[顶级机场] '
FilterHK: ^(?=.*((?i)🇭🇰|香港|(\b(HK|HKG|Hong)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$
FilterTW: ^(?=.*((?i)🇹🇼|台湾|(\b(TW|TWN|Tai|Taiwan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$
FilterJP: ^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|JPN|Japan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$
FilterKR: ^(?=.*((?i)🇰🇷|韩国|韓|首尔|(\b(KR|KOR|Korea)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$
FilterSG: ^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|SGP|Singapore)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$
FilterUS: ^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$
FilterUK: ^(?=.*((?i)🇬🇧|英国|伦敦|(\b(UK|GBR|United Kingdom)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$
FilterFR: ^(?=.*((?i)🇫🇷|法国|(\b(FR|FRA|France)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$
FilterDE: ^(?=.*((?i)🇩🇪|德国|(\b(DE|DEU|Germany)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$
FilterGame: ^(?=.*((?i)游戏|🎮|(\b(GAME)(\d+)?\b)))(?!.*((?i)回国|校园)).*$
FilterAll: ^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic)(\d+)?\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$
UrlTest:
  type: url-test
  interval: 30
  tolerance: 30
  lazy: true
  url: https://www.gstatic.com/generate_204
  disable-udp: false
  timeout: 2000
  max-failed-times: 3
  hidden: false
  include-all-providers: true
  empty-fallback: REJECT
FallBack:
  type: fallback
  interval: 30
  lazy: true
  url: https://www.gstatic.com/generate_204
  disable-udp: false
  timeout: 2000
  max-failed-times: 3
  hidden: false
  include-all-providers: true
  empty-fallback: REJECT
LoadBalance:
  type: load-balance
  interval: 30
  lazy: true
  url: https://www.gstatic.com/generate_204
  disable-udp: false
  strategy: consistent-hashing
  timeout: 2000
  max-failed-times: 3
  hidden: true
  include-all-providers: true
  empty-fallback: REJECT
RuleProviders:
  type: http
  behavior: classical
  interval: 3600
  format: yaml
  proxy: DIRECT
